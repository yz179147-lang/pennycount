<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>PennyCount 記帳</title>
<meta name="description" content="用 Google Sheet 當資料庫的輕量記帳工具">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PennyCount">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 首次啟動：設定後端網址與存取碼 -->
<section id="onboarding" class="onboarding" hidden>
  <div class="onboarding__card">
    <h1>PennyCount</h1>
    <p class="muted">連到你自己的 Google Sheet 帳本。這些設定只存在這台裝置上。</p>
    <label class="field">
      <span>Apps Script 網頁應用程式網址</span>
      <input id="setup-url" type="url" inputmode="url" autocomplete="off"
             placeholder="https://script.google.com/macros/s/AKfy.../exec">
    </label>
    <label class="field">
      <span>存取碼 API_TOKEN</span>
      <input id="setup-token" type="text" autocomplete="off" placeholder="執行 setup() 後取得">
    </label>
    <p id="setup-error" class="error" hidden></p>
    <button id="setup-save" class="btn btn--primary">連線</button>
  </div>
</section>

<div id="app" class="app" hidden>
  <header class="topbar">
    <button id="month-prev" class="topbar__nav" aria-label="上個月">‹</button>
    <div class="topbar__center">
      <input id="month" class="topbar__month" type="month" aria-label="選擇月份">
      <div class="topbar__stats">
        <span class="stat stat--expense">支出 <b id="sum-expense">-</b></span>
        <span class="stat stat--income">收入 <b id="sum-income">-</b></span>
        <span class="stat">結餘 <b id="sum-balance">-</b></span>
      </div>
    </div>
    <button id="month-next" class="topbar__nav" aria-label="下個月">›</button>
  </header>

  <main class="views">
    <!-- 記帳 -->
    <section class="view" data-view="entry">
      <div class="type-switch" role="tablist">
        <button class="type-switch__btn is-active" data-type="expense" role="tab">支出</button>
        <button class="type-switch__btn" data-type="income" role="tab">收入</button>
      </div>

      <div class="amount" aria-live="polite">
        <span class="amount__currency">$</span>
        <span id="amount" class="amount__value">0</span>
      </div>

      <div id="categories" class="categories" role="listbox" aria-label="分類"></div>

      <div class="entry-meta">
        <input id="entry-date" type="date" aria-label="日期">
        <input id="entry-note" type="text" placeholder="備註（選填）" maxlength="60" aria-label="備註">
      </div>

      <div class="keypad">
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key" data-key=".">.</button>
        <button class="key" data-key="0">0</button>
        <button class="key" data-key="del" aria-label="退格">⌫</button>
      </div>

      <button id="save" class="btn btn--primary btn--save">儲存</button>
    </section>

    <!-- 紀錄 -->
    <section class="view" data-view="records" hidden>
      <div class="filters">
        <input id="search" type="search" placeholder="搜尋備註或分類" aria-label="搜尋">
        <select id="filter-type" aria-label="收支篩選">
          <option value="">全部</option>
          <option value="expense">只看支出</option>
          <option value="income">只看收入</option>
        </select>
      </div>
      <div id="record-list" class="record-list"></div>
    </section>

    <!-- 統計 -->
    <section class="view" data-view="stats" hidden>
      <div class="cards">
        <div class="card"><span class="card__label">支出</span><b id="stat-expense" class="card__value card__value--expense">-</b></div>
        <div class="card"><span class="card__label">收入</span><b id="stat-income" class="card__value card__value--income">-</b></div>
        <div class="card"><span class="card__label">結餘</span><b id="stat-balance" class="card__value">-</b></div>
      </div>
      <h2 class="section-title">每日支出</h2>
      <div id="daily-chart" class="daily-chart"></div>
      <h2 class="section-title">分類佔比</h2>
      <div id="category-bars" class="category-bars"></div>
    </section>

    <!-- 設定 -->
    <section class="view" data-view="settings" hidden>
      <div class="settings">
        <label class="field">
          <span>後端網址</span>
          <input id="cfg-url" type="url" inputmode="url" autocomplete="off">
        </label>
        <label class="field">
          <span>存取碼</span>
          <input id="cfg-token" type="text" autocomplete="off">
        </label>
        <div class="settings__row">
          <button id="cfg-save" class="btn btn--primary">儲存設定</button>
          <button id="cfg-test" class="btn">測試連線</button>
        </div>
        <p id="cfg-status" class="muted"></p>
        <hr>
        <p class="muted">待送出的紀錄：<b id="outbox-count">0</b> 筆</p>
        <button id="outbox-flush" class="btn">立即重送</button>
        <hr>
        <p class="muted">在 iPhone 上：Safari 開啟此頁 → 分享 → 加入主畫面，就能像 App 一樣使用。</p>
        <button id="cfg-reset" class="btn btn--danger">清除本機設定</button>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab is-active" data-tab="entry"><span>＋</span>記帳</button>
    <button class="tab" data-tab="records"><span>☰</span>紀錄</button>
    <button class="tab" data-tab="stats"><span>％</span>統計</button>
    <button class="tab" data-tab="settings"><span>⚙</span>設定</button>
  </nav>
</div>

<!-- 編輯／刪除單筆 -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet__backdrop" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="編輯紀錄">
    <h2 class="sheet__title">編輯紀錄</h2>
    <label class="field"><span>金額</span><input id="edit-amount" type="number" inputmode="decimal" step="0.01"></label>
    <label class="field"><span>分類</span><select id="edit-category"></select></label>
    <label class="field"><span>日期</span><input id="edit-date" type="date"></label>
    <label class="field"><span>備註</span><input id="edit-note" type="text" maxlength="60"></label>
    <div class="sheet__actions">
      <button id="edit-delete" class="btn btn--danger">刪除</button>
      <button id="edit-cancel" class="btn" data-close>取消</button>
      <button id="edit-save" class="btn btn--primary">儲存</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
